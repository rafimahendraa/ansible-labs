
---
services:
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: silo
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"

    volumes:
      - silo-data:/data

    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  silo-data:
