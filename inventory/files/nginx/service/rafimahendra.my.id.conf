server {
    listen 80;
    server_name rafimahendra.my.id;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rafimahendra.my.id;

    ssl_certificate /etc/nginx/ssl/cloudflare/cf.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare/cf.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/rafimahendra-access.log;
    error_log /var/log/nginx/rafimahendra-error.log;

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
