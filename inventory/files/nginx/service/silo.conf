server {
    listen 80;
    server_name silo.techcornerrio.web.id;
    return 301 https://silo.techcornerrio.web.id$request_uri;
}

# 1. Silo Console (Web UI) di Port 443 (Standard HTTPS)
server {
    listen 443 ssl;
    server_name silo.techcornerrio.web.id;
    
    ssl_certificate /etc/nginx/ssl/techcornerrio.web.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/techcornerrio.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# 2. S3 Storage API di Port 9443
server {
    listen 9443 ssl;
    server_name silo.techcornerrio.web.id;
    
    ssl_certificate /etc/nginx/ssl/techcornerrio.web.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/techcornerrio.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
