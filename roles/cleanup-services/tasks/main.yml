---
- name: Find Docker Compose files
  ansible.builtin.find:
    paths: "{{ cleanup_compose_source_dir }}"
    patterns: "{{ cleanup_compose_filename }}"
    file_type: file
    recurse: true
  delegate_to: localhost
  become: false
  register: cleanup_compose_files

- name: Stop Docker Compose services
  ansible.builtin.command:
    cmd: docker compose -f {{ cleanup_compose_filename }} down
    chdir: "{{ cleanup_compose_deploy_dir }}/{{ item.path | dirname | basename }}"
  loop: "{{ cleanup_compose_files.files }}"
  when: >
    stat_result.stat.exists
  vars:
    stat_result: "{{ lookup('ansible.builtin.fileglob', '/dev/null', errors='ignore') }}"
  changed_when: true

- name: Remove Docker Compose service directories
  ansible.builtin.file:
    path: "{{ cleanup_compose_deploy_dir }}/{{ item.path | dirname | basename }}"
    state: absent
  loop: "{{ cleanup_compose_files.files }}"

- name: Remove Nginx service configurations
  ansible.builtin.find:
    paths: "{{ cleanup_nginx_source_dir }}"
    patterns: "*.conf"
    file_type: file
  delegate_to: localhost
  become: false
  register: cleanup_nginx_files

- name: Remove Nginx configurations from server
  ansible.builtin.file:
    path: "{{ cleanup_nginx_config_dir }}/{{ item.path | basename }}"
    state: absent
  loop: "{{ cleanup_nginx_files.files }}"

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Restart Nginx
  ansible.builtin.service:
    name: "{{ cleanup_nginx_service }}"
    state: restarted