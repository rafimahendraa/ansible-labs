---
# Docker Compose source directory
cleanup_compose_source_dir: "{{ playbook_dir }}/../inventory/files"

# Docker Compose deployment directory
cleanup_compose_deploy_dir: /opt

# Docker Compose filename
cleanup_compose_filename: docker-compose.yml

# Nginx configuration source directory
cleanup_nginx_source_dir: "{{ playbook_dir }}/../inventory/files/nginx/service"

# Nginx configuration directory
cleanup_nginx_config_dir: /etc/nginx/conf.d

# Nginx service name
cleanup_nginx_service: nginx