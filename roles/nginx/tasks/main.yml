---
- name: Install Nginx, OpenSSL Python bindings, and dig
  ansible.builtin.apt:
    name:
      - "{{ nginx_package }}"
      - python3-cryptography
      - dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Find Nginx configuration files
  ansible.builtin.find:
    paths: "{{ nginx_cloudflare_config_source_dir }}"
    patterns: "*.conf"
    file_type: file
  delegate_to: localhost
  become: false
  register: nginx_cloudflare_config_files

- name: Create Cloudflare SSL directory
  ansible.builtin.file:
    path: "{{ nginx_cloudflare_ssl_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy Cloudflare Origin Certificates
  ansible.builtin.copy:
    src: "{{ nginx_cloudflare_ssl_source_dir }}/{{ item.certificate }}"
    dest: "{{ nginx_cloudflare_ssl_dir }}/{{ item.certificate }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_cloudflare_certificates }}"

- name: Copy Cloudflare Private Keys
  ansible.builtin.copy:
    src: "{{ nginx_cloudflare_ssl_source_dir }}/{{ item.private_key }}"
    dest: "{{ nginx_cloudflare_ssl_dir }}/{{ item.private_key }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ nginx_cloudflare_certificates }}"
  no_log: true

- name: Copy Nginx Cloudflare configurations
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ nginx_cloudflare_config_dir }}/{{ item.path | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_cloudflare_config_files.files }}"

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Reload Nginx
  ansible.builtin.service:
    name: "{{ nginx_cloudflare_service }}"
    state: reloaded