
---
- name: Install Nginx, OpenSSL Python bindings, and dig
  ansible.builtin.apt:
    name:
      - "{{ nginx_package }}"
      - python3-cryptography
      - dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create SSL directory on target server
  ansible.builtin.file:
    path: "{{ nginx_ssl_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate Let's Encrypt ACME account key
  community.crypto.openssl_privatekey:
    path: "{{ nginx_acme_account_key }}"
    size: 4096
    type: RSA
    mode: "0600"

- name: Generate domain private key
  community.crypto.openssl_privatekey:
    path: "{{ nginx_ssl_privkey }}"
    size: 2048
    type: RSA
    mode: "0600"

- name: Generate Certificate Signing Request (CSR) with SAN
  community.crypto.openssl_csr:
    path: "{{ nginx_ssl_csr }}"
    privatekey_path: "{{ nginx_ssl_privkey }}"
    common_name: "{{ nginx_cert_common_name }}"
    subject_alt_name: "{{ nginx_cert_san }}"
    mode: "0644"

- name: Step 1 - Request DNS-01 challenge from Let's Encrypt
  community.crypto.acme_certificate:
    account_key_src: "{{ nginx_acme_account_key }}"
    account_email: "{{ nginx_acme_email }}"
    src: "{{ nginx_ssl_csr }}"
    cert: "{{ nginx_ssl_cert }}"
    chain: "{{ nginx_ssl_chain }}"
    fullchain: "{{ nginx_ssl_fullchain }}"
    challenge: dns-01
    acme_directory: "{{ nginx_acme_directory }}"
    acme_version: 2
    terms_agreed: true
    remaining_days: 30
  register: acme_challenge

- name: Display required TXT records to add in Jagoan Hosting DNS
  ansible.builtin.debug:
    msg:
      - "=================================================================="
      - "TAMBAHKAN TXT RECORD BERIKUT DI PANEL DNS JAGOAN HOSTING:"
      - "Host / Name : {{ item.value['dns-01'].record }} (atau {{ item.value['dns-01'].record | regex_replace('\\.techcornerrio\\.web\\.id$', '') }})"
      - "Type        : TXT"
      - "Value       : {{ item.value['dns-01'].resource_value }}"
      - "TTL         : 300 (atau minimum yang tersedia)"
      - "=================================================================="
  loop: "{{ acme_challenge.challenge_data | dict2items }}"
  when: acme_challenge is changed

- name: Pause playbook until TXT records are added in Jagoan Hosting
  ansible.builtin.pause:
    prompt: >-
      Tambahkan SEMUA TXT record di atas ke DNS Jagoan Hosting.
      Setelah disimpan, tekan ENTER untuk melanjutkan pengecekan via 1.1.1.1...
  when: acme_challenge is changed

- name: Verify TXT record propagation via 1.1.1.1
  ansible.builtin.command:
    cmd: "dig @{{ nginx_dns_resolver }} +short TXT {{ item.value['dns-01'].record }}"
  register: dig_check
  until: item.value['dns-01'].resource_value in dig_check.stdout
  retries: 30
  delay: 10
  changed_when: false
  loop: "{{ acme_challenge.challenge_data | dict2items }}"
  when: acme_challenge is changed

- name: Step 2 - Validate DNS-01 challenge and issue certificate
  community.crypto.acme_certificate:
    account_key_src: "{{ nginx_acme_account_key }}"
    account_email: "{{ nginx_acme_email }}"
    src: "{{ nginx_ssl_csr }}"
    cert: "{{ nginx_ssl_cert }}"
    chain: "{{ nginx_ssl_chain }}"
    fullchain: "{{ nginx_ssl_fullchain }}"
    challenge: dns-01
    acme_directory: "{{ nginx_acme_directory }}"
    acme_version: 2
    terms_agreed: true
    remaining_days: 30
    data: "{{ acme_challenge }}"
  when: acme_challenge is changed

- name: Deploy Nginx main configuration
  ansible.builtin.copy:
    src: "{{ nginx_main_config_src }}"
    dest: "{{ nginx_main_config_dest }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload Nginx

- name: Deploy Nginx reverse proxy configurations
  ansible.builtin.copy:
    src: "{{ nginx_service_config_src }}/{{ item }}"
    dest: "{{ nginx_service_config_dest }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_service_configs }}"
  notify: Reload Nginx

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true
