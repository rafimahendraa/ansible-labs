---
# Nginx package configuration
nginx_package: nginx

# Cloudflare Origin SSL
nginx_cloudflare_ssl_source_dir: "{{ playbook_dir }}/../inventory/files/nginx/ssl"
nginx_cloudflare_ssl_dir: /etc/nginx/ssl/cloudflare

# Nginx configuration
nginx_cloudflare_config_source_dir: "{{ playbook_dir }}/../inventory/files/nginx/service"
nginx_cloudflare_config_dir: /etc/nginx/conf.d
nginx_cloudflare_service: nginx

# SSL certificates
nginx_cloudflare_certificates:
  - name: cf
    certificate: cf.crt
    private_key: cf.key