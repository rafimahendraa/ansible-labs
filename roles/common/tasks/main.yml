
---
- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == common_supported_distribution
      - ansible_distribution_version in common_supported_versions
    fail_msg: >-
      This role supports Ubuntu 24.04 and Ubuntu 26.04 only.
      Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ common_apt_cache_valid_time }}"

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Ensure Chrony service is enabled and running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
