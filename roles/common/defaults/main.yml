---
# Supported operating systems
common_supported_distribution: Ubuntu
common_supported_versions:
  - "24.04"
  - "26.04"

# APT configuration
common_apt_cache_valid_time: 3600
common_apt_upgrade: dist

# Common packages
common_packages:
  # Repository and security prerequisites
  - ca-certificates
  - curl
  - gnupg

  # Python
  - python3
  - python3-apt

  # System administration
  - git
  - vim
  - htop
  - jq
  - unzip
  - tar
  - dnsutils
  - net-tools
  - chrony