
---
- name: Create Docker Compose application directories
  ansible.builtin.file:
    path: "{{ item.project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ docker_compose_services }}"

- name: Copy Docker Compose files to target server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/inventory/files/{{ item.name }}/{{ item.compose_file }}"
    dest: "{{ item.project_dir }}/{{ item.compose_file }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ docker_compose_services }}"

- name: Copy Silo environment file securely
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/inventory/files/silo/.env"
    dest: "/opt/silo/.env"
    owner: root
    group: root
    mode: "0600"
  when: "'silo' in (docker_compose_services | map(attribute='name') | list)"

- name: Validate Docker Compose configuration
  ansible.builtin.command:
    cmd: docker compose -f {{ item.compose_file }} config --quiet
    chdir: "{{ item.project_dir }}"
  changed_when: false
  loop: "{{ docker_compose_services }}"

- name: Deploy Docker Compose applications
  ansible.builtin.command:
    cmd: docker compose -f {{ item.compose_file }} up -d
    chdir: "{{ item.project_dir }}"
  loop: "{{ docker_compose_services }}"

